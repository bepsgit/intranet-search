<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intranet Search</title>
<style>
  :root {
    --navy: #002664;
    --border: #cdd3d6;
    --bg: #ffffff;
    --field: #f2f2f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    background: var(--bg);
    font-family: "Segoe UI", Arial, sans-serif;
  }
  form {
    display: flex;
    gap: 8px;
    max-width: 640px;
  }
  label {
    position: absolute;
    left: -9999px;
  }
  input[type="search"] {
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--field);
  }
  input[type="search"]:focus {
    outline: 2px solid var(--navy);
    outline-offset: 1px;
    background: #fff;
  }
  button {
    padding: 10px 18px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--navy);
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #1a3c7a; }
</style>
</head>
<body>
  <form action="https://education.nsw.gov.au/search" method="get" target="_top">
    <label for="q">Search Inside the Department</label>
    <input type="search" id="q" name="q" placeholder="Search Inside the Department" required>
    <input type="hidden" name="search_start" value="/content/main-education/en/home/inside-the-department">
    <input type="hidden" name="referrer" value="/content/main-education/en/home/inside-the-department">
    <button type="submit">Search</button>
  </form>
</body>
</html>
